# Public deployment overlay: Caddy in front (automatic HTTPS + login),
# backend and app no longer published on the host.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Needs in .env: APP_DOMAIN, API_DOMAIN (both pointing at this server's IP),
# BASIC_AUTH_USER, BASIC_AUTH_HASH (see DEPLOYMENT.md), TRUST_IDS_TOKEN.

services:
  backend:
    ports: !reset []
  app:
    ports: !reset []
    environment:
      TRUST_IDS_BACKEND_PUBLIC: https://${API_DOMAIN}

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on: [app, backend]
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # TLS certificates
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
